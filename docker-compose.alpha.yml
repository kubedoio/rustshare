# Alpha dogfooding Docker Compose override.
# =============================================================================
# Adds the Buzz relay runtime on top of the base stack so a clean operator can
# bring up the complete Elembra Alpha stack with one command:
#
#   ./scripts/elembra.sh up
#
# Services added: buzz-postgres, buzz-redis, buzz-rustfs(+init) — the relay's
# backing services — and buzz-relay (the authoritative Chat engine). The
# observation bridge is the managed chat-observer container. The canonical
# wrapper applies docker-compose.dogfood.yml so the observer and backend share
# the relay's host-derived community namespace (ADR-0034).
#
# Chat identities are generated by `./scripts/elembra.sh init --with-chat`.
# Load config/buzz-compatibility.env before using this file so the relay image
# is pinned to the supported Buzz implementation.
#
# Teardown:
#   docker compose -f docker-compose.yml -f docker-compose.alpha.yml \
#     -f docker-compose.dogfood.yml down -v
#   (the -v flag also removes the buzz-* volumes; omit it to keep relay state)
# =============================================================================

services:
  # Buzz is the production/dogfood Chat authority: every channel/message
  # decision comes from the community's relay (v1alpha1 upstream contract).
  # The bridge key is the same owner/service key the observer and relay admit
  # with the generated deployment service identity. Startup validation
  # hard-fails a misconfigured Buzz mode — there is no silent local fallback.
  backend:
    environment:
      RUSTSHARE_CHAT_AUTHORITY: "buzz"
      RUSTSHARE_CHAT_ALLOW_LOCAL_RELAY: "false"
      RUSTSHARE_CHAT_BRIDGE_SECRET_KEY: ${BUZZ_SERVICE_SK:-}
      RUSTSHARE_CHAT_DEPLOYMENT_RELAY_URL: ${RUSTSHARE_CHAT_DEPLOYMENT_RELAY_URL:-ws://localhost:7447}
      # Zero-config Chat bootstrap (ADR-0036): the supported deployment runs
      # in auto mode — enabling Chat provisions the Workspace↔Community
      # mapping from the deployment Buzz relay.
      RUSTSHARE_CHAT_PROVISIONING: ${RUSTSHARE_CHAT_PROVISIONING:-auto}
      RUSTSHARE_CHAT_BOOTSTRAP_RELAY_URL: ${BUZZ_RELAY_WS:-ws://localhost:7447}
      # Optional OpenAI-compatible Ask provider (see runbook §3). Leave the
      # key unset to keep Ask gated (ask_available=false, #244); credentials
      # come from .env, never from this file.
      ELEMBRA_LLM_API_KEY: ${ELEMBRA_LLM_API_KEY:-}
      ELEMBRA_LLM_BASE_URL: ${ELEMBRA_LLM_BASE_URL:-}
      ELEMBRA_LLM_MODEL: ${ELEMBRA_LLM_MODEL:-}
      ELEMBRA_LLM_TEMPERATURE: ${ELEMBRA_LLM_TEMPERATURE:-}
      ELEMBRA_LLM_TIMEOUT_SECS: ${ELEMBRA_LLM_TIMEOUT_SECS:-30}

  chat-observer:
    build:
      context: .
      dockerfile: docker/chat-observer.Dockerfile
    profiles: ["chat"]
    restart: unless-stopped
    environment:
      BUZZ_RELAY_WS: ${BUZZ_RELAY_WS:-ws://buzz-relay:7447}
      BUZZ_RELAY_PUBKEY: ${BUZZ_RELAY_PUBKEY:-}
      BUZZ_SERVICE_SK: ${BUZZ_SERVICE_SK:-}
      RUSTSHARE_CHAT_WEBHOOK_SECRET: ${RUSTSHARE_CHAT_WEBHOOK_SECRET:-}
      ELEMBRA_WEBHOOK_URL: ${ELEMBRA_WEBHOOK_URL:-http://backend:8080/api/v1/integrations/buzz/events}
      BUZZ_OBSERVER_HEALTH_PORT: ${BUZZ_OBSERVER_HEALTH_PORT:-8091}
      BUZZ_CHANNEL_POLL_MS: ${BUZZ_CHANNEL_POLL_MS:-15000}
      BUZZ_MAX_RECONNECT_BACKOFF_S: ${BUZZ_MAX_RECONNECT_BACKOFF_S:-30}
    depends_on:
      backend:
        condition: service_healthy
      buzz-relay:
        condition: service_started

  chat-bootstrap:
    build:
      context: .
      dockerfile: docker/chat-observer.Dockerfile
    profiles: ["chat-init"]
    restart: "no"
    user: "${ELEMBRA_HOST_UID:-1000}:${ELEMBRA_HOST_GID:-1000}"
    environment:
      ELEMBRA_CHAT_ENV_FILE: /out/chat.env
      BUZZ_SERVICE_SK: ${BUZZ_SERVICE_SK:-}
      RUSTSHARE_CHAT_BRIDGE_SECRET_KEY: ${RUSTSHARE_CHAT_BRIDGE_SECRET_KEY:-}
      BUZZ_RELAY_OWNER_PUBKEY: ${BUZZ_RELAY_OWNER_PUBKEY:-}
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY:-}
      BUZZ_RELAY_PUBKEY: ${BUZZ_RELAY_PUBKEY:-}
      BUZZ_RELAY_WS: ${BUZZ_RELAY_WS:-ws://localhost:7447}
      BUZZ_RELAY_URL: ${BUZZ_RELAY_URL:-}
      RUSTSHARE_CHAT_AUTHORITY: ${RUSTSHARE_CHAT_AUTHORITY:-buzz}
      RUSTSHARE_CHAT_PROVISIONING: ${RUSTSHARE_CHAT_PROVISIONING:-auto}
      RUSTSHARE_CHAT_BOOTSTRAP_RELAY_URL: ${RUSTSHARE_CHAT_BOOTSTRAP_RELAY_URL:-}
      RUSTSHARE_CHAT_DEPLOYMENT_RELAY_URL: ${RUSTSHARE_CHAT_DEPLOYMENT_RELAY_URL:-}
      ELEMBRA_CHAT_ROTATE: ${ELEMBRA_CHAT_ROTATE:-false}
    volumes:
      - ./.elembra:/out
    entrypoint: ["node", "scripts/chat-bootstrap.mjs"]

  buzz-postgres:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${BUZZ_POSTGRES_PASSWORD:-buzz_dev}
      POSTGRES_DB: buzz
      PGDATA: /var/lib/postgresql/data
    volumes:
      - buzz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz"]
      interval: 10s
      timeout: 5s
      retries: 5

  buzz-redis:
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  buzz-rustfs:
    # Buzz's startup conformance probe exercises concurrent conditional S3
    # writes; RustFS 1.0.0 is the first supported baseline used here.
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: unless-stopped
    environment:
      RUSTFS_ROOT_USER: ${BUZZ_RUSTFS_ACCESS_KEY:-buzz_dev}
      RUSTFS_ROOT_PASSWORD: ${BUZZ_RUSTFS_SECRET_KEY:-buzz_dev_secret}
      RUSTFS_DATA_DIR: /data
      RUSTFS_LOGS_DIR: /logs
    volumes:
      - buzz_rustfs_data:/data
      - buzz_rustfs_logs:/logs
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 9000 && nc -z localhost 9001"]
      interval: 10s
      timeout: 5s
      retries: 5

  buzz-rustfs-init:
    image: rustfs/rc@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    restart: "no"
    depends_on:
      buzz-rustfs:
        condition: service_healthy
    environment:
      BUZZ_RUSTFS_ACCESS_KEY: ${BUZZ_RUSTFS_ACCESS_KEY:-buzz_dev}
      BUZZ_RUSTFS_SECRET_KEY: ${BUZZ_RUSTFS_SECRET_KEY:-buzz_dev_secret}
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        rc alias set local http://buzz-rustfs:9000
        $${BUZZ_RUSTFS_ACCESS_KEY:-buzz_dev} $${BUZZ_RUSTFS_SECRET_KEY:-buzz_dev_secret}
        && rc bucket create local/buzz-media --ignore-existing --quiet

  buzz-relay:
    # The relay image MUST contain the v1alpha1 authorization API (access
    # check/check-batch, channels, state events, community identity).
    # The supported image is loaded from config/buzz-compatibility.env and is
    # pinned by OCI digest. Never use a floating upstream image here.
    # The relay has NO published ports in this file: the dogfood layout
    # shares the backend's network namespace (docker-compose.dogfood.yml)
    # and the standalone conformance layout publishes them
    # (docker-compose.conformance.yml). The engine rejects port publishing
    # on a container using network_mode service:<x>.
    image: ${BUZZ_RELAY_IMAGE:?load config/buzz-compatibility.env before starting the Alpha stack}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://buzz:${BUZZ_POSTGRES_PASSWORD:-buzz_dev}@buzz-postgres:5432/buzz
      REDIS_URL: redis://buzz-redis:6379
      RELAY_URL: ${BUZZ_RELAY_URL:-ws://localhost:7447}
      BUZZ_BIND_ADDR: 0.0.0.0:7447
      BUZZ_HEALTH_PORT: "8088"
      BUZZ_METRICS_PORT: "9102"
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_REQUIRE_AUTH_TOKEN: "false"
      # Elembra uses the hardened Chat-only Buzz runtime. Git routes/probes are
      # explicitly disabled; the generic Buzz image remains Git-capable.
      BUZZ_GIT_ENABLED: "false"
      RELAY_OWNER_PUBKEY: ${BUZZ_RELAY_OWNER_PUBKEY:-}
      # Trusted-service allowlist for the v1alpha1 authorization API: the
      # Elembra gateway's NIP-98 service key. The owner pubkey IS that key
      # The generated service public key is used for both owner and trusted
      # service authorization. With an empty allowlist the API rejects every
      # caller (401)
      # and buzz mode cannot run.
      RELAY_TRUSTED_SERVICE_PUBKEYS: ${BUZZ_RELAY_OWNER_PUBKEY:-}
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY:-}
      BUZZ_S3_ENDPOINT: http://buzz-rustfs:9000
      BUZZ_S3_ACCESS_KEY: ${BUZZ_RUSTFS_ACCESS_KEY:-buzz_dev}
      BUZZ_S3_SECRET_KEY: ${BUZZ_RUSTFS_SECRET_KEY:-buzz_dev_secret}
      BUZZ_S3_BUCKET: buzz-media
    depends_on:
      buzz-postgres:
        condition: service_healthy
      buzz-redis:
        condition: service_healthy
      buzz-rustfs:
        condition: service_healthy
      buzz-rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      # The hardened buzz-elembra image is distroless (no shell/curl). Use
      # Buzz's native healthcheck mode so Compose does not widen the runtime
      # attack surface merely to probe readiness.
      test: ["CMD", "/usr/local/bin/buzz-relay", "--healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 30

volumes:
  buzz_postgres_data:
  buzz_rustfs_data:
  buzz_rustfs_logs:
