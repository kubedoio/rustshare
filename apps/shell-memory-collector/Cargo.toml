[package]
name = "shell-memory-collector"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "elembra-shell-memory"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
libc = "0.2"
glob = { workspace = true }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
dotenvy = "0.15"
rustshare-auth = { path = "../../backend/crates/auth" }
rustshare-core = { path = "../../backend/crates/core" }
rustshare-crypto = { path = "../../backend/crates/crypto" }
rustshare-infrastructure = { path = "../../backend/crates/infrastructure" }
rustshare-resource-auth = { path = "../../backend/crates/resource-auth" }
rustshare-server = { path = "../../backend/server" }
rustshare-storage = { path = "../../backend/crates/storage" }
sqlx = { workspace = true }
tempfile = { workspace = true }
