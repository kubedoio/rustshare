[package]
name = "local-text-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "elembra-local-text-worker"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
glob = { workspace = true }
hex = { workspace = true }
libc = "0.2"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
notify = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
sqlx = { workspace = true }
rustshare-storage = { path = "../../backend/crates/storage" }
tempfile = { workspace = true }
url = { workspace = true }
