[package]
name = "rustshare-desktop"
version = "0.1.0"
edition = "2021"
authors = ["RustShare Contributors"]
license = "Apache-2.0"
description = "Desktop sync client for RustShare (App Shell)"

[[bin]]
name = "rustshare-desktop"
path = "src/main.rs"

[dependencies]
sync-engine = { path = "../../crates/sync-engine" }
sync-domain = { path = "../../crates/sync-domain" }
sync-protocol = { path = "../../crates/sync-protocol" }
platform = { path = "../../crates/platform" }

# Using workspace dependencies where possible
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# App specific
tauri = { version = "2.2", optional = true } # Placeholder for recommended shell

[features]
default = []
gui = ["tauri"]
