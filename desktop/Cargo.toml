[package]
name = "rustshare-desktop"
version = "0.1.0"
edition = "2021"
authors = ["RustShare Contributors"]
license = "Apache-2.0"
description = "Desktop sync client for RustShare"

[[bin]]
name = "rustshare-desktop"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.50", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# File system watching
notify = { version = "6.1", features = ["macos_fsevent"] }
walkdir = "2.5"

# SQLite
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls"], default-features = false }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Configuration directories
directories = "5.0"
dirs = "5.0"

# Secure token storage
keyring = "3.6"

# Crypto for hashing
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUIDs
uuid = { version = "1.7", features = ["v4", "serde"] }

# WebSocket for real-time sync
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2.5"

# File locking for safe concurrent access
fs4 = { version = "0.12", features = ["tokio"] }

# MIME type detection
mime_guess = "2.0"
bytes = "1.5"

# Path utilities
pathdiff = "0.2"
urlencoding = "2.1"

# Debouncing for file watcher
debounce = "0.2"

[dev-dependencies]
tempfile = "3.10"
mockall = "0.12"
wiremock = "0.6"
