name: Feature Request
description: Suggest an idea for RustShare
title: "[feat]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe the problem and proposed solution.

        > **Do not post secrets.** Please do not include passwords, tokens, private URLs, customer data, or confidential logs in public issues. If you are reporting a security problem, see [SECURITY.md](../../SECURITY.md) to report it privately.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? What is missing or frustrating?
      placeholder: As a user, I want to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered other approaches or workarounds?

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, mockups, or references.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues and this feature has not been requested yet.
          required: true
        - label: I have not included sensitive information (passwords, tokens, private URLs, customer data, or confidential logs).
          required: true
