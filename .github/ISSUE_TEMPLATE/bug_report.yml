name: Bug Report
description: Report a problem with RustShare
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.

        > **Do not post secrets.** Please do not include passwords, tokens, private URLs, customer data, or confidential logs in public issues. If you are reporting a security problem, see [SECURITY.md](../../SECURITY.md) to report it privately.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or Commit
      description: What version of RustShare are you running? (git commit SHA, Docker image tag, or release version)
      placeholder: e.g., v0.1.0 or abc1234
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      description: How are you running RustShare?
      options:
        - Docker Compose
        - Local development (cargo run)
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Please redact secrets, tokens, and passwords before posting.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or configuration details.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues and this bug has not been reported yet.
          required: true
        - label: I have redacted sensitive information (passwords, tokens, keys) from logs and descriptions.
          required: true
