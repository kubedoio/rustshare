version: 2
updates:
  # Backend Rust dependencies: keep routine updates separate from breaking majors.
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      cargo-backend-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "rand"
        update-types:
          - "minor"
          - "patch"
      cargo-backend-rand:
        patterns:
          - "rand"
      cargo-backend-major:
        patterns:
          - "*"
        exclude-patterns:
          - "rand"
        update-types:
          - "major"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"

  # Frontend dependencies: React and other majors need migration-sized PRs.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"

  # GitHub Actions: ignore nonexistent fixed Rust toolchain action tags.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
        versions:
          - "1.*"
    groups:
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "dtolnay/rust-toolchain"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"

  # Root Rust workspace dependencies: keep routine updates separate from breaking majors.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      cargo-root-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "rand"
        update-types:
          - "minor"
          - "patch"
      cargo-root-rand:
        patterns:
          - "rand"
      cargo-root-major:
        patterns:
          - "*"
        exclude-patterns:
          - "rand"
        update-types:
          - "major"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      docker-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
