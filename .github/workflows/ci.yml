name: CI

# Covers the backend workspace and the root workspace (including apps/desktop and crates/).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  dco-check:
    name: DCO Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify DCO sign-off
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            HEAD_COMMIT="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || ! git merge-base --is-ancestor "${{ github.event.before }}" HEAD >/dev/null 2>&1; then
            BASE="HEAD~1"
            HEAD_COMMIT="HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD_COMMIT="HEAD"
          fi
          COMMITS=$(git log --format='%H' "${BASE}..${HEAD_COMMIT}")
          MISSING=0
          for COMMIT in $COMMITS; do
            # Skip merge commits (commits with more than 1 parent)
            PARENTS=$(git rev-list --parents -n 1 "$COMMIT" | wc -w)
            if [ "$PARENTS" -gt 2 ]; then
              echo "Skipping merge commit $COMMIT"
              continue
            fi

            # Skip Dependabot commits
            AUTHOR=$(git log -1 --format='%an' "$COMMIT")
            if [ "$AUTHOR" = "dependabot[bot]" ]; then
              echo "Skipping Dependabot commit $COMMIT"
              continue
            fi

            if ! git log -1 --format='%B' "$COMMIT" | grep -q 'Signed-off-by:'; then
              echo "ERROR: Commit $COMMIT is missing DCO sign-off"
              git log -1 --format='  %H %s' "$COMMIT"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "Every commit must include a DCO sign-off. Use: git commit -s"
            exit 1
          fi
          echo "All commits have DCO sign-off"


  generate-secrets:
    name: Generate Secrets
    runs-on: ubuntu-latest
    outputs:
      pg_password: ${{ steps.secrets.outputs.pg_password }}
    steps:
      - name: Generate PostgreSQL password
        id: secrets
        run: |
          PG_PASSWORD=$(openssl rand -hex 32)
          echo "pg_password=${PG_PASSWORD}" >> "$GITHUB_OUTPUT"

  production-compose-contract:
    name: Production Compose Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify production deployment safeguards
        env:
          POSTGRES_PASSWORD: compose-validation-only
          RUSTFS_ROOT_USER: compose-validation-only
          RUSTFS_ROOT_PASSWORD: compose-validation-only
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json > /tmp/production-compose.json
          jq -e '.services.nginx.ports == [{"mode":"ingress","host_ip":"127.0.0.1","target":80,"published":"8080","protocol":"tcp"}]' /tmp/production-compose.json
          jq -e '.services.backend.healthcheck.test | index("http://127.0.0.1:8080/health/ready")' /tmp/production-compose.json
          jq -e '.services.rustfs.image | test("^rustfs/rustfs@sha256:[0-9a-f]{64}$")' /tmp/production-compose.json
          grep -q 'proxy_set_header X-Forwarded-Proto \$forwarded_proto;' docker/nginx.conf
          docker run --rm --add-host backend:127.0.0.1 --add-host rustfs:127.0.0.1 -v "$PWD/docker/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine nginx -t

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --check
        working-directory: ./backend

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features -- -D warnings
        working-directory: ./backend

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [generate-secrets]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ${{ needs.generate-secrets.outputs.pg_password }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      SQLX_OFFLINE: true
      # Per-run cryptographically random database password. The container is
      # ephemeral and only reachable from within this job.
      POSTGRES_PASSWORD: ${{ needs.generate-secrets.outputs.pg_password }}
      DATABASE_URL: postgres://postgres:${{ needs.generate-secrets.outputs.pg_password }}@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --features postgres
      - name: Run migrations
        run: cd backend && sqlx migrate run
      - name: Run tests
        run: cargo test --all-features --lib --test openapi_export_test
        working-directory: ./backend

  # Validates that the project compiles in release mode (expensive but required by audit).
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --all-features
        working-directory: ./backend

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo install cargo-deny --locked
      - run: cargo deny --manifest-path backend/Cargo.toml --all-features check

  root-workspace:
    name: Root Workspace
    runs-on: ubuntu-latest
    needs: [generate-secrets]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ${{ needs.generate-secrets.outputs.pg_password }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      SQLX_OFFLINE: true
      POSTGRES_PASSWORD: ${{ needs.generate-secrets.outputs.pg_password }}
      DATABASE_URL: postgres://postgres:${{ needs.generate-secrets.outputs.pg_password }}@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --features postgres
      - name: Run migrations
        run: cd backend && sqlx migrate run
      - name: Check workspace
        run: cargo check --workspace
      - name: Test workspace
        run: cargo test --workspace --lib

  sqlx-check:
    name: SQLx Prepare Check
    runs-on: ubuntu-latest
    needs: [generate-secrets]
    env:
      # Per-run cryptographically random database password. The container is
      # ephemeral and only reachable from within this job.
      POSTGRES_PASSWORD: ${{ needs.generate-secrets.outputs.pg_password }}
      DATABASE_URL: postgres://postgres:${{ needs.generate-secrets.outputs.pg_password }}@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --features postgres
      - name: Start PostgreSQL
        run: |
          docker run -d -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" -p 5432:5432 pgvector/pgvector:pg16
          sleep 5
      - name: Run migrations
        run: cd backend && sqlx migrate run
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Check sqlx prepare
        run: cd backend && cargo sqlx prepare --workspace --check
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [generate-secrets]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ${{ needs.generate-secrets.outputs.pg_password }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      SQLX_OFFLINE: true
      POSTGRES_PASSWORD: ${{ needs.generate-secrets.outputs.pg_password }}
      DATABASE_URL: postgres://postgres:${{ needs.generate-secrets.outputs.pg_password }}@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --features postgres
      - name: Run migrations
        run: cd backend && sqlx migrate run
      - name: Generate coverage
        # Use --lib to avoid integration tests that require PostgreSQL + S3 services.
        # The timing-attack test needs the local Postgres service started above.
        run: cargo llvm-cov --all-features --workspace --lib --lcov --output-path lcov.info
        working-directory: ./backend
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
