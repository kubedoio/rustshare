name: CI

permissions:
  contents: read

# Covers the unified Rust workspace (backend crates, server, apps/desktop, and client crates).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  generate-secrets:
    name: Generate Secrets
    runs-on: ubuntu-latest
    outputs:
      pg_password: ${{ steps.secrets.outputs.pg_password }}
    steps:
      - name: Generate PostgreSQL password
        id: secrets
        run: |
          PG_PASSWORD=$(openssl rand -hex 32)
          echo "pg_password=${PG_PASSWORD}" >> "$GITHUB_OUTPUT"

  production-compose-contract:
    name: Production Compose Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify production deployment safeguards
        env:
          POSTGRES_PASSWORD: compose-validation-only
          RUSTFS_ROOT_USER: compose-validation-only
          RUSTFS_ROOT_PASSWORD: compose-validation-only
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json > /tmp/production-compose.json
          jq -e '.services.nginx.ports == [{"mode":"ingress","host_ip":"127.0.0.1","target":80,"published":"8080","protocol":"tcp"}]' /tmp/production-compose.json
          jq -e '.services.backend.healthcheck.test == ["CMD", "/usr/local/bin/rustshare-server", "--healthcheck"]' /tmp/production-compose.json
          jq -e '.services.rustfs.image | test("^rustfs/rustfs@sha256:[0-9a-f]{64}$")' /tmp/production-compose.json
          grep -q 'proxy_set_header X-Forwarded-Proto \$forwarded_proto;' docker/nginx.conf
          docker run --rm --add-host backend:127.0.0.1 --add-host rustfs:127.0.0.1 -v "$PWD/docker/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine nginx -t

  monitoring-compose-contract:
    name: Monitoring Compose Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate monitoring stack configuration
        env:
          # Placeholder values for interpolation only; nothing is deployed.
          METRICS_API_TOKEN: compose-validation-only
          GRAFANA_ADMIN_PASSWORD: compose-validation-only
        run: |
          # Interpolation and schema check of the monitoring compose file.
          # --profile dashboards: grafana is behind that profile, and plain
          # 'compose config' omits profile-gated services.
          docker compose -f docker-compose.monitoring.yml --profile dashboards config --format json > /tmp/monitoring-compose.json
          jq -e '.services.prometheus.image | test("^prom/prometheus@sha256:[0-9a-f]{64}$")' /tmp/monitoring-compose.json
          jq -e '.services["blackbox-exporter"].image | test("^prom/blackbox-exporter@sha256:[0-9a-f]{64}$")' /tmp/monitoring-compose.json
          jq -e '.services.alertmanager.image | test("^prom/alertmanager@sha256:[0-9a-f]{64}$")' /tmp/monitoring-compose.json
          jq -e '.services.grafana.image | test("^grafana/grafana@sha256:[0-9a-f]{64}$")' /tmp/monitoring-compose.json
          # Prometheus config + alert rules. Mounted at /etc/prometheus so
          # the absolute rule_files path in prometheus.yml resolves; a dummy
          # token file is mounted at the credentials_file path so the
          # authorization reference validates.
          printf 'ci-validation-only' > /tmp/prometheus-metrics-token
          # The image entrypoint is the server binary; override it to run the
          # CLI tools.
          docker run --rm --entrypoint promtool \
            -v "$PWD/docker/monitoring:/etc/prometheus:ro" \
            -v "/tmp/prometheus-metrics-token:/tmp/prometheus-metrics-token:ro" \
            prom/prometheus@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e \
            check config /etc/prometheus/prometheus.yml
          # AlertManager routing config.
          docker run --rm --entrypoint amtool -v "$PWD/docker/monitoring:/cfg:ro" \
            prom/alertmanager@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a \
            check-config /cfg/alertmanager.yml

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [generate-secrets]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ${{ needs.generate-secrets.outputs.pg_password }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      SQLX_OFFLINE: true
      # Per-run cryptographically random database password. The container is
      # ephemeral and only reachable from within this job.
      POSTGRES_PASSWORD: ${{ needs.generate-secrets.outputs.pg_password }}
      DATABASE_URL: postgres://postgres:${{ needs.generate-secrets.outputs.pg_password }}@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --features postgres
      - name: Run migrations
        run: sqlx migrate run --source backend/migrations
      - name: Run tests
        run: cargo test --workspace --all-features --lib --test openapi_export_test

  # Validates that the project compiles in release mode (expensive but required by audit).
  build-release:
    name: Build Release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --all-features

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
      - run: cargo install cargo-deny --locked
      - run: cargo deny --manifest-path Cargo.toml --all-features check

  sqlx-check:
    name: SQLx Prepare Check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [generate-secrets]
    env:
      # Per-run cryptographically random database password. The container is
      # ephemeral and only reachable from within this job.
      POSTGRES_PASSWORD: ${{ needs.generate-secrets.outputs.pg_password }}
      DATABASE_URL: postgres://postgres:${{ needs.generate-secrets.outputs.pg_password }}@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --features postgres
      - name: Start PostgreSQL
        run: |
          docker run -d -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" -p 5432:5432 pgvector/pgvector:pg16
          sleep 5
      - name: Run migrations
        run: sqlx migrate run --source backend/migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Check sqlx prepare
        run: cargo sqlx prepare --workspace --check
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  coverage:
    name: Code Coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [generate-secrets]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ${{ needs.generate-secrets.outputs.pg_password }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      SQLX_OFFLINE: true
      POSTGRES_PASSWORD: ${{ needs.generate-secrets.outputs.pg_password }}
      DATABASE_URL: postgres://postgres:${{ needs.generate-secrets.outputs.pg_password }}@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --features postgres
      - name: Run migrations
        run: sqlx migrate run --source backend/migrations
      - name: Generate coverage
        # Use --lib to avoid integration tests that require PostgreSQL + S3 services.
        # The timing-attack test needs the local Postgres service started above.
        run: cargo llvm-cov --all-features --workspace --lib --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info
