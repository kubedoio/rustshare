name: Pilot Release

on:
  pull_request:
    paths:
      - '.github/workflows/pilot-release.yml'
      - 'docker-compose.yml'
      - 'docker-compose.pilot.yml'
      - 'docker/backend.Dockerfile'
      - 'backend/**'
      - 'frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/**'
      - 'rust-toolchain.toml'
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rustshare-backend

jobs:
  pilot-compose-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build pilot backend image
        run: docker build -f docker/backend.Dockerfile -t rustshare-backend:pilot .

      - name: Validate pilot compose profile
        env:
          RUSTSHARE_BACKEND_IMAGE: rustshare-backend:pilot
        run: docker compose -f docker-compose.yml -f docker-compose.pilot.yml config >/tmp/pilot-compose.yaml

      - name: Boot pilot stack
        env:
          RUSTSHARE_BACKEND_IMAGE: rustshare-backend:pilot
          # CI secrets must be configured in repository Settings > Secrets and variables > Actions
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          RUSTSHARE_SECRET_ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
          # Pilot smoke test credentials — ephemeral values generated per-run
          POSTGRES_PASSWORD: pilot-db-${{ github.run_id }}-${{ github.run_attempt }}
          DATABASE_URL: postgres://rustshare:pilot-db-${{ github.run_id }}-${{ github.run_attempt }}@postgres:5432/rustshare
          RUSTFS_ROOT_USER: pilot-rustfs-${{ github.run_id }}
          RUSTFS_ROOT_PASSWORD: pilot-rustfs-${{ github.run_id }}-${{ github.run_attempt }}
          AWS_ACCESS_KEY_ID: pilot-rustfs-${{ github.run_id }}
          AWS_SECRET_ACCESS_KEY: pilot-rustfs-${{ github.run_id }}-${{ github.run_attempt }}
          RUSTSHARE_ADMIN_PASSWORD: pilot-admin-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose -f docker-compose.yml -f docker-compose.pilot.yml up -d postgres rustfs backend nginx

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1/health >/tmp/pilot-health.json; then
              cat /tmp/pilot-health.json
              exit 0
            fi
            sleep 5
          done
          echo "Pilot stack did not become healthy in time" >&2
          exit 1

      - name: Show service status on failure
        if: failure()
        env:
          RUSTSHARE_BACKEND_IMAGE: rustshare-backend:pilot
        run: |
          docker compose -f docker-compose.yml -f docker-compose.pilot.yml ps
          docker compose -f docker-compose.yml -f docker-compose.pilot.yml logs --tail=200

      - name: Tear down pilot stack
        if: always()
        env:
          RUSTSHARE_BACKEND_IMAGE: rustshare-backend:pilot
        run: docker compose -f docker-compose.yml -f docker-compose.pilot.yml down -v

  publish-pilot-image:
    if: github.event_name != 'pull_request'
    needs: pilot-compose-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: tags
        run: |
          SHA_TAG="sha-${GITHUB_SHA}"
          TAGS="$SHA_TAG"

          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            TAGS="$TAGS edge nightly-$(date +%Y-%m-%d)"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "sha=$SHA_TAG" >> $GITHUB_OUTPUT

      - name: Build image
        run: |
          TAGS="${{ steps.tags.outputs.tags }}"
          TAG_ARGS=""
          for tag in $TAGS; do
            TAG_ARGS="$TAG_ARGS -t $IMAGE_NAME:$tag"
          done
          docker build -f docker/backend.Dockerfile $TAG_ARGS .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on Trivy findings
        run: |
          if [ -f trivy-results.sarif ]; then
            COUNT=$(jq '.runs[0].results | length' trivy-results.sarif)
            if [ "$COUNT" -gt 0 ]; then
              echo "Found $COUNT HIGH/CRITICAL vulnerabilities"
              exit 1
            fi
          fi

      - name: Push image
        run: |
          TAGS="${{ steps.tags.outputs.tags }}"
          for tag in $TAGS; do
            docker push $IMAGE_NAME:$tag
          done
