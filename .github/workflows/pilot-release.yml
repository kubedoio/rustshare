name: Pilot Release

on:
  pull_request:
    paths:
      - '.github/workflows/pilot-release.yml'
      - 'docker-compose.yml'
      - 'docker-compose.pilot.yml'
      - 'docker/backend.Dockerfile'
      - 'backend/**'
      - 'frontend/**'
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rustshare-backend

jobs:
  pilot-compose-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build pilot backend image
        run: docker build -f docker/backend.Dockerfile -t rustshare-backend:pilot .

      - name: Validate pilot compose profile
        env:
          RUSTSHARE_BACKEND_IMAGE: rustshare-backend:pilot
        run: docker compose -f docker-compose.yml -f docker-compose.pilot.yml config >/tmp/pilot-compose.yaml

      - name: Boot pilot stack
        env:
          RUSTSHARE_BACKEND_IMAGE: rustshare-backend:pilot
          # CI secrets must be configured in repository Settings > Secrets and variables > Actions
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          RUSTSHARE_SECRET_ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
          # Pilot smoke test credentials (not secrets — these are ephemeral test values)
          POSTGRES_PASSWORD: pilot-test-db-password
          DATABASE_URL: postgres://rustshare:pilot-test-db-password@postgres:5432/rustshare
          RUSTFS_ROOT_USER: pilot-rustfs-user
          RUSTFS_ROOT_PASSWORD: pilot-rustfs-password
          AWS_ACCESS_KEY_ID: pilot-rustfs-user
          AWS_SECRET_ACCESS_KEY: pilot-rustfs-password
          RUSTSHARE_ADMIN_PASSWORD: pilot-admin-password
        run: docker compose -f docker-compose.yml -f docker-compose.pilot.yml up -d postgres rustfs backend nginx

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1/health >/tmp/pilot-health.json; then
              cat /tmp/pilot-health.json
              exit 0
            fi
            sleep 5
          done
          echo "Pilot stack did not become healthy in time" >&2
          exit 1

      - name: Show service status on failure
        if: failure()
        env:
          RUSTSHARE_BACKEND_IMAGE: rustshare-backend:pilot
        run: |
          docker compose -f docker-compose.yml -f docker-compose.pilot.yml ps
          docker compose -f docker-compose.yml -f docker-compose.pilot.yml logs --tail=200

      - name: Tear down pilot stack
        if: always()
        env:
          RUSTSHARE_BACKEND_IMAGE: rustshare-backend:pilot
        run: docker compose -f docker-compose.yml -f docker-compose.pilot.yml down -v

  publish-pilot-image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tagged pilot image
        run: |
          docker build -f docker/backend.Dockerfile \
            -t $IMAGE_NAME:${GITHUB_SHA} \
            -t $IMAGE_NAME:latest \
            .
          docker push $IMAGE_NAME:${GITHUB_SHA}
          docker push $IMAGE_NAME:latest
