name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'crates/**'
      - 'apps/obsidian-vault-sync/**'
      - 'frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/integration-tests.yml'
      - 'config/buzz-compatibility.env'
      - 'docker-compose*.yml'
      - 'scripts/guard-buzz-no-acl.sh'
      - 'scripts/run-buzz-conformance.sh'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'crates/**'
      - 'apps/obsidian-vault-sync/**'
      - 'frontend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/integration-tests.yml'
      - 'config/buzz-compatibility.env'
      - 'docker-compose*.yml'
      - 'scripts/guard-buzz-no-acl.sh'
      - 'scripts/run-buzz-conformance.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  generate-secrets:
    name: Generate Secrets
    runs-on: ubuntu-latest
    outputs:
      pg_password: ${{ steps.secrets.outputs.pg_password }}
      jwt_secret: ${{ steps.secrets.outputs.jwt_secret }}
      encryption_key: ${{ steps.secrets.outputs.encryption_key }}
      admin_password: ${{ steps.secrets.outputs.admin_password }}
      rustfs_root_user: ${{ steps.secrets.outputs.rustfs_root_user }}
      rustfs_root_password: ${{ steps.secrets.outputs.rustfs_root_password }}
    steps:
      - name: Generate ephemeral secrets
        id: secrets
        run: |
          # Per-run cryptographically random secrets. These are passed as job
          # outputs so subsequent jobs can reference them without hardcoding
          # anything in this file.
          PG_PASSWORD="$(openssl rand -hex 32)"
          echo "pg_password=${PG_PASSWORD}" >> "$GITHUB_OUTPUT"
          JWT_SECRET="$(openssl rand -base64 32 | tr -d '\n')"
          echo "jwt_secret=${JWT_SECRET}" >> "$GITHUB_OUTPUT"
          ENCRYPTION_KEY="$(openssl rand -base64 32 | tr -d '\n')"
          echo "encryption_key=${ENCRYPTION_KEY}" >> "$GITHUB_OUTPUT"
          ADMIN_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')"
          echo "admin_password=${ADMIN_PASSWORD}" >> "$GITHUB_OUTPUT"
          RUSTFS_ROOT_USER="$(openssl rand -base64 64 | tr -dc 'A-Za-z0-9' | head -c 20)"
          echo "rustfs_root_user=${RUSTFS_ROOT_USER}" >> "$GITHUB_OUTPUT"
          RUSTFS_ROOT_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')"
          echo "rustfs_root_password=${RUSTFS_ROOT_PASSWORD}" >> "$GITHUB_OUTPUT"

  integration-tests:
    runs-on: ubuntu-latest
    needs: [generate-secrets]
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: rustshare
          POSTGRES_USER: rustshare
          POSTGRES_PASSWORD: ${{ needs.generate-secrets.outputs.pg_password }}
        options: >-
          --health-cmd "pg_isready -U rustshare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      CARGO_TERM_COLOR: always
      # Per-run cryptographically random secrets. These are not real secrets;
      # they are generated for each run and discarded afterwards.
      POSTGRES_PASSWORD: ${{ needs.generate-secrets.outputs.pg_password }}
      DATABASE_URL: postgres://rustshare:${{ needs.generate-secrets.outputs.pg_password }}@localhost:5432/rustshare
      JWT_SECRET: ${{ needs.generate-secrets.outputs.jwt_secret }}
      RUSTSHARE_SECRET_ENCRYPTION_KEY: ${{ needs.generate-secrets.outputs.encryption_key }}
      RUSTSHARE_ADMIN_PASSWORD: ${{ needs.generate-secrets.outputs.admin_password }}
      RUSTFS_ROOT_USER: ${{ needs.generate-secrets.outputs.rustfs_root_user }}
      RUSTFS_ROOT_PASSWORD: ${{ needs.generate-secrets.outputs.rustfs_root_password }}
      AWS_ACCESS_KEY_ID: ${{ needs.generate-secrets.outputs.rustfs_root_user }}
      AWS_SECRET_ACCESS_KEY: ${{ needs.generate-secrets.outputs.rustfs_root_password }}
      RUSTFS_ENDPOINT: http://127.0.0.1:9000
      RUSTFS_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      RUSTFS_REGION: us-east-1
      RUSTFS_BUCKET: rustshare-files
      RUSTSHARE_OBJECT_STORE_AUTO_CREATE_BUCKET: "true"
      RUSTSHARE_ADMIN_EMAIL: admin@localhost
      RUSTSHARE_ADMIN_USERNAME: admin
      PASSWORD_LOGIN_ENABLED: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Start RustFS
        run: |
          docker run -d --name rustfs \
            -p 9000:9000 -p 9001:9001 \
            -e RUSTFS_ROOT_USER="${RUSTFS_ROOT_USER}" \
            -e RUSTFS_ROOT_PASSWORD="${RUSTFS_ROOT_PASSWORD}" \
            -e RUSTFS_DATA_DIR=/data \
            -e RUSTFS_LOGS_DIR=/logs \
            rustfs/rustfs@sha256:60f4f2f41ce95216f8cac676e69f9d90c0bfec458a3bc7fd7fb9b7c2452ac57a

      - name: Wait for RustFS to be ready
        run: |
          for i in {1..30}; do
            if nc -z 127.0.0.1 9000 && nc -z 127.0.0.1 9001; then
              echo "RustFS is ready"
              exit 0
            fi
            echo "Waiting for RustFS..."
            sleep 2
          done
          echo "RustFS did not become ready in time"
          exit 1

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.6 --features postgres --locked

      - name: Run migrations
        run: sqlx migrate run --source backend/migrations

      - name: Run all integration tests
        # `-j 1` serializes the test binaries: the outbox integration suite
        # and the rustshare-storage outbox unit tests each wipe the same six
        # integration tables, so running them concurrently would race on the
        # shared fixture state.
        run: cargo test --workspace --all-features -j 1 -- --ignored

      - name: Ask Workspace security matrix (repeated)
        # Keep this explicit: the recording-provider matrix is the security
        # gate for source authorization and must pass twice, independently of
        # the broad ignored-test sweep above.
        run: |
          cargo test -p rustshare-server --test unified_search_test --features test-recording-provider -- --ignored --test-threads=1
          cargo test -p rustshare-server --test unified_search_test --features test-recording-provider -- --ignored --test-threads=1

  buzz-conformance:
    name: Buzz Live Conformance
    # The live proofs (backend/tests/buzz_live_conformance_test.rs) run the
    # in-process Elembra AppState against the supported immutable Buzz image
    # from config/buzz-compatibility.env, over the v1alpha1 upstream contract
    # (docs/specs/buzz-upstream-authorization-v1alpha1.md).
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Structural guard (proof 8 — no Elembra ACL, no direct Buzz DB)
        run: ./scripts/guard-buzz-no-acl.sh

      - name: Run the live Buzz conformance suite
        # Starts all Elembra and Buzz dependencies from the pinned compatibility
        # manifest, provisions fresh state, runs the suite, and tears down.
        run: ./scripts/run-buzz-conformance.sh

      - name: Buzz conformance diagnostics
        if: failure()
        run: |
          diagnostics_file="${TMPDIR:-/tmp}/buzz-conformance-diagnostics.log"
          if [ -f "${diagnostics_file}" ]; then
            sed -n '1,320p' "${diagnostics_file}"
          else
            echo "No Buzz diagnostics file was produced at ${diagnostics_file}."
          fi
