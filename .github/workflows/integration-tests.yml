name: Integration Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'crates/**'
      - 'apps/obsidian-vault-sync/**'
      - '.github/workflows/integration-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'crates/**'
      - 'apps/obsidian-vault-sync/**'
      - '.github/workflows/integration-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rustshare
          POSTGRES_USER: rustshare
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd "pg_isready -U rustshare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      CARGO_TERM_COLOR: always
      # Ephemeral, run-scoped database password. Not a real secret.
      POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_URL: postgres://rustshare:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/rustshare
      RUSTFS_ENDPOINT: http://127.0.0.1:9000
      RUSTFS_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      RUSTFS_REGION: us-east-1
      RUSTFS_BUCKET: rustshare-files
      RUSTSHARE_ADMIN_EMAIL: admin@localhost
      RUSTSHARE_ADMIN_USERNAME: admin
      PASSWORD_LOGIN_ENABLED: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Generate ephemeral secrets
        run: |
          # Per-run cryptographically random secrets. These are written to GITHUB_ENV
          # so subsequent steps can reference them without hardcoding anything in this file.
          JWT_SECRET=$(openssl rand -base64 32 | tr -d '\n')
          ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')
          ADMIN_PASSWORD=$(openssl rand -base64 24 | tr -d '\n')
          RUSTFS_ROOT_USER="rustfs-${{ github.run_id }}"
          RUSTFS_ROOT_PASSWORD=$(openssl rand -base64 24 | tr -d '\n')

          echo "JWT_SECRET=${JWT_SECRET}" >> "$GITHUB_ENV"
          echo "RUSTSHARE_SECRET_ENCRYPTION_KEY=${ENCRYPTION_KEY}" >> "$GITHUB_ENV"
          echo "RUSTSHARE_ADMIN_PASSWORD=${ADMIN_PASSWORD}" >> "$GITHUB_ENV"
          echo "RUSTFS_ROOT_USER=${RUSTFS_ROOT_USER}" >> "$GITHUB_ENV"
          echo "RUSTFS_ROOT_PASSWORD=${RUSTFS_ROOT_PASSWORD}" >> "$GITHUB_ENV"
          # RustFS root credentials must match the S3 credentials used by the backend.
          echo "AWS_ACCESS_KEY_ID=${RUSTFS_ROOT_USER}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${RUSTFS_ROOT_PASSWORD}" >> "$GITHUB_ENV"

      - name: Start RustFS
        run: |
          docker run -d --name rustfs \
            -p 9000:9000 -p 9001:9001 \
            -e RUSTFS_ROOT_USER="${RUSTFS_ROOT_USER}" \
            -e RUSTFS_ROOT_PASSWORD="${RUSTFS_ROOT_PASSWORD}" \
            -e RUSTFS_ALLOW_INSECURE_DEFAULT_CREDENTIALS=true \
            -e RUSTFS_DATA_DIR=/data \
            -e RUSTFS_LOGS_DIR=/logs \
            rustfs/rustfs:1.0.0-beta.6

      - name: Wait for RustFS to be ready
        run: |
          for i in {1..30}; do
            if nc -z 127.0.0.1 9000 && nc -z 127.0.0.1 9001; then
              echo "RustFS is ready"
              exit 0
            fi
            echo "Waiting for RustFS..."
            sleep 2
          done
          echo "RustFS did not become ready in time"
          exit 1

      - name: Create RustFS bucket
        run: |
          set +e
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" \
            -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" \
            amazon/aws-cli:2.34.59 \
            --endpoint-url http://127.0.0.1:9000 \
            s3 mb s3://rustshare-files > /tmp/bucket-create.log 2>&1
          bucket_status=$?
          set -e

          cat /tmp/bucket-create.log

          if [ "$bucket_status" -eq 0 ]; then
            echo "Bucket created."
          elif grep -q "BucketAlreadyOwnedByYou" /tmp/bucket-create.log; then
            echo "Bucket already exists, continuing..."
          else
            echo "Bucket creation failed:"
            cat /tmp/bucket-create.log
            exit 1
          fi

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --features postgres --locked

      - name: Run migrations
        run: cd backend && sqlx migrate run

      - name: Run all integration tests
        run: cd backend && cargo test --all-features -- --ignored
