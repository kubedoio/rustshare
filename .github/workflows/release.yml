name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3 or 0.8.0-alpha.1)'
        required: true
        type: string
      qualification_only:
        description: 'Build and qualify the current protected main commit before creating its release tag'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kubedoio/rustshare-backend
  OBSERVER_IMAGE_NAME: ghcr.io/kubedoio/rustshare-chat-observer

concurrency:
  # Serialize tag pushes and manual dispatches together so the immutable
  # tag-existence check cannot race another release attempt.
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_major_minor: ${{ steps.resolve.outputs.version_major_minor }}
      version_major: ${{ steps.resolve.outputs.version_major }}
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      docker_tags: ${{ steps.resolve.outputs.docker_tags }}
      qualification_only: ${{ steps.resolve.outputs.qualification_only }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve version and commit
        id: resolve
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          TAG_REF: ${{ github.ref_name }}
          QUALIFICATION_ONLY: ${{ github.event.inputs.qualification_only }}
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_event="${{ github.event_name }}"
          COMMIT="${{ github.sha }}"

          if [[ "$workflow_event" == "workflow_dispatch" ]]; then
            # The dispatch input is a bare version; the tag carries the v prefix.
            TAG="v${DISPATCH_VERSION}"
          else
            TAG="$TAG_REF"
          fi

          if [[ "$workflow_event" == "workflow_dispatch" && "$QUALIFICATION_ONLY" == "true" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::qualification must run from protected main"
              exit 1
            fi
            MAIN_SHA="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
            if [[ -z "$MAIN_SHA" || "$MAIN_SHA" != "$COMMIT" ]]; then
              echo "::error::qualification must use the current protected main commit (run=${COMMIT}, main=${MAIN_SHA:-missing})"
              exit 1
            fi
            set +e
            tag_lookup="$(git ls-remote --exit-code origin "refs/tags/${TAG}" 2>&1)"
            tag_lookup_rc=$?
            set -e
            if [[ "${tag_lookup_rc}" -eq 0 ]]; then
              echo "::error::qualification requires ${TAG} to be absent"
              exit 1
            fi
            if [[ "${tag_lookup_rc}" -ne 2 || -n "${tag_lookup}" ]]; then
              echo "::error::unable to verify that ${TAG} is absent (${tag_lookup:-git ls-remote exited ${tag_lookup_rc}})"
              exit 1
            fi
            CHECK_SUMMARY="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name != "Validate tag")] | {total:length, bad:[.[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length}')"
            CHECK_TOTAL="$(jq -r '.total' <<<"${CHECK_SUMMARY}")"
            CHECK_BAD="$(jq -r '.bad' <<<"${CHECK_SUMMARY}")"
            if [[ "${CHECK_TOTAL}" -eq 0 || "${CHECK_BAD}" -ne 0 ]]; then
              echo "::error::protected-main checks are missing or not all successful (${CHECK_SUMMARY})"
              exit 1
            fi
            echo "Protected main checks passed: ${CHECK_TOTAL} completed checks"
          fi

          # Single source of truth for tag grammar and release metadata.
          source scripts/release-tag.sh
          if ! resolve_release_tag "$TAG" > /tmp/release-tag.out; then
            echo "::error::Invalid release tag: $TAG. Expected strict semver with a v prefix (e.g., v0.7.0 or v0.8.0-alpha.1)."
            exit 1
          fi

          # The commit the release tag points at; used by the dispatch guard
          # below and by the release-immutability decision.
          TAG_SHA="$(git rev-parse "${TAG}^{}" 2>/dev/null || true)"

          if [[ "$workflow_event" == "workflow_dispatch" && "$QUALIFICATION_ONLY" != "true" ]]; then
            # A dispatch must reference an EXISTING tag at the exact commit
            # being released. A released version can never be rebuilt from a
            # different workflow/source commit.
            if [[ -z "$TAG_SHA" || "$TAG_SHA" != "$COMMIT" ]]; then
              echo "::error::workflow_dispatch version '${DISPATCH_VERSION}' must exist as tag ${TAG} pointing at commit ${COMMIT} (found ${TAG_SHA:-none})."
              exit 1
            fi
          fi

          # Release immutability (before any build): an existing GitHub release
          # always rejects the attempt. A defective release must use the next
          # version; it must never be rebuilt under the same version.
          # gh exits 0 when the release exists; on HTTP errors it exits 1, so
          # the status line distinguishes "not found" from real failures (any
          # non-200/404 status fails the job closed). Only stdout is parsed —
          # gh prints the response headers there with -i — while stderr keeps
          # gh's own error text in the step log; a missing status line (e.g.
          # gh failed before any HTTP response) also fails the job closed.
          # '+' in build-metadata tags must be %-encoded in the API path.
          ENCODED_TAG="${TAG//+/%2B}"
          set +e
          api_out="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${ENCODED_TAG}" --silent -i)"
          api_rc=$?
          set -e
          status_line="$(printf '%s\n' "$api_out" | head -n1)"
          if [[ -z "$status_line" ]]; then
            echo "::error::release immutability check failed: gh api exited ${api_rc} without an HTTP status line; refusing to proceed"
            exit 1
          fi
          status="${status_line#* }" # "404 Not Found"
          status="${status%% *}"     # "404"
          RELEASE_EXISTS=false
          if [[ "$status" == "200" ]]; then
            RELEASE_EXISTS=true
          elif [[ "$status" == "404" ]]; then
            :
          else
            echo "::error::release immutability check failed (HTTP ${status}); refusing to proceed"
            exit 1
          fi
          DECISION="$(immutability_decision "$RELEASE_EXISTS" || true)"
          echo "Immutability decision: ${DECISION}"
          if [[ "$DECISION" == FAIL:* ]]; then
            echo "::error::${DECISION#FAIL:}"
            exit 1
          fi

          # resolve_release_tag emits GITHUB_OUTPUT-compatible key=value lines
          # (multiline docker_tags via the <<RS_EOF delimiter); append verbatim.
          cat /tmp/release-tag.out >> "$GITHUB_OUTPUT"
          {
            echo "commit=$COMMIT"
            echo "tag=$TAG"
            echo "should_release=true"
            echo "qualification_only=${QUALIFICATION_ONLY}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: $(grep -E '^(version|is_prerelease|release_name)=' /tmp/release-tag.out | tr '\n' ' ')"

  build-binaries:
    name: Build release binaries
    needs: validate-tag
    if: needs.validate-tag.outputs.should_release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    # Build inside the same base image the Dockerfile builder stage uses
    # (rust:1.97.1-bookworm, glibc 2.36). Building on the ubuntu-latest host
    # (glibc 2.39) produced binaries that cannot load in the
    # older runtime images (GLIBC_2.38/2.39 not found).
    container:
      image: rust:1.97.1-bookworm
    # The container's default shell is /bin/sh (dash), which lacks the `[[`
    # builtin used by the stage step — the arm64 leg silently fell into the
    # x86_64 strip branch and failed. Force bash for every step of this job.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # The container build links against glibc 2.36; keep its cache key
          # separate from the host (glibc 2.39) CI runs so each restores its
          # own artifacts.
          prefix-key: release-container

      - name: Install cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          apt-get update
          apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin rustshare-server
        env:
          CARGO_NET_RETRY: 10

      - name: Stage binary artifact
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            aarch64-linux-gnu-strip "target/${{ matrix.target }}/release/rustshare-server"
          else
            strip "target/${{ matrix.target }}/release/rustshare-server"
          fi
          cp "target/${{ matrix.target }}/release/rustshare-server" "rustshare-server-${{ matrix.target }}"
          chmod +x "rustshare-server-${{ matrix.target }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: rustshare-server-${{ matrix.target }}
          if-no-files-found: error

  build-and-push-image:
    name: Build and push Docker image
    needs: [validate-tag, build-binaries]
    if: needs.validate-tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest || steps.qualified.outputs.backend_digest }}
      observer_digest: ${{ steps.build_observer.outputs.digest || steps.qualified.outputs.observer_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./
          pattern: binary-*
          merge-multiple: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve qualified image digests for release tag
        id: qualified
        if: needs.validate-tag.outputs.qualification_only != 'true'
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
        run: |
          set -euo pipefail
          qualified_tag="qualified-${RELEASE_COMMIT}"
          digests="$(scripts/resolve-qualified-image-digests.sh \
            "${IMAGE_NAME}:${qualified_tag}" \
            "${OBSERVER_IMAGE_NAME}:${qualified_tag}")"
          printf '%s\n' "${digests}" >> "${GITHUB_OUTPUT}"
          echo "Using pre-tag qualified images for ${RELEASE_COMMIT}"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # Kept for LABELS only: the build is tagged with the unadvertised
          # candidate tag, and the released tags (docker_tags + sha) are
          # created only after all image, SBOM, and provenance gates pass. The
          # metadata action derives the OCI version label from the first tag,
          # so it is pinned to the real release version below; revision,
          # created, source, etc. are emitted as before.
          tags: |
            type=raw,value=candidate-${{ github.run_id }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate-tag.outputs.version }}

      - name: Build and push candidate
        id: build
        if: needs.validate-tag.outputs.qualification_only == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Only the candidate tag is pushed here; release tags are promoted
          # from this digest after the boot gate.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            USE_PRECOMPILED=true
            VERSION=${{ needs.validate-tag.outputs.version }}
            REVISION=${{ needs.validate-tag.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract observer Docker metadata
        id: observer_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.OBSERVER_IMAGE_NAME }}
          tags: |
            type=raw,value=candidate-${{ github.run_id }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate-tag.outputs.version }}

      - name: Build and push observer candidate
        id: build_observer
        if: needs.validate-tag.outputs.qualification_only == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/chat-observer.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.observer_meta.outputs.tags }}
          labels: ${{ steps.observer_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test observer candidate
        shell: bash
        env:
          QUALIFICATION_ONLY: ${{ needs.validate-tag.outputs.qualification_only }}
          RELEASE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ "${QUALIFICATION_ONLY}" == true ]]; then
            IMAGE_REF="${OBSERVER_IMAGE_NAME}:candidate-${GITHUB_RUN_ID}"
          else
            IMAGE_REF="${OBSERVER_IMAGE_NAME}:qualified-${RELEASE_COMMIT}"
          fi
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "${platform}" "${IMAGE_REF}" \
              node --check scripts/buzz-observer.mjs
          done

      - name: Inspect backend runtime dependencies
        shell: bash
        env:
          QUALIFICATION_ONLY: ${{ needs.validate-tag.outputs.qualification_only }}
          RELEASE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ "${QUALIFICATION_ONLY}" == true ]]; then
            IMAGE_REF="${IMAGE_NAME}:candidate-${GITHUB_RUN_ID}"
          else
            IMAGE_REF="${IMAGE_NAME}:qualified-${RELEASE_COMMIT}"
          fi
          for platform in linux/amd64 linux/arm64; do
            container_id="$(docker create --platform "${platform}" "${IMAGE_REF}" /usr/local/bin/rustshare-server)"
            binary="$(mktemp)"
            trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true; rm -f "${binary}"' EXIT
            docker cp "${container_id}:/usr/local/bin/rustshare-server" "${binary}"
            dependencies="$(readelf -d "${binary}" | sed -n 's/.*Shared library: \[\([^]]*\)\].*/\1/p')"
            printf '%s dependencies:\n%s\n' "${platform}" "${dependencies}"
            grep -qx 'libgcc_s.so.1' <<<"${dependencies}"
            if grep -Eq 'lib(ssl|crypto)\.so' <<<"${dependencies}"; then
              echo "::error::Unexpected OpenSSL dependency in ${platform} runtime"
              exit 1
            fi
            docker rm -f "${container_id}" >/dev/null
            rm -f "${binary}"
            trap - EXIT
          done

      - name: Boot smoke test (exec bit + dynamic linker)
        shell: bash
        env:
          QUALIFICATION_ONLY: ${{ needs.validate-tag.outputs.qualification_only }}
          RELEASE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
        run: |
          # Re-resolve the multi-platform tag on each leg; the runner's classic
          # Docker store cannot replace one platform digest with another.
          if [[ "${QUALIFICATION_ONLY}" == true ]]; then
            IMAGE_REF="${IMAGE_NAME}:candidate-${GITHUB_RUN_ID}"
          else
            IMAGE_REF="${IMAGE_NAME}:qualified-${RELEASE_COMMIT}"
          fi
          # The server has no --help/--version: main() ignores argv and boots
          # straight into startup, which first validates config and connects to
          # Postgres. Without a database it exits 1 quickly — that is a PASS,
          # because it proves the kernel executed the file and the dynamic
          # linker resolved it. The two boot defects this gate guards against
          # both die before any app code runs:
          #   missing exec bit / exec format -> exit 126
          #   glibc version mismatch -> ld.so error on stderr, exit 1 or 127
          # Exit codes alone cannot separate a loader failure from the app's
          # own no-database exit (both can be 1), so the log is also scanned
          # for ld.so's distinctive error messages. The container is started
          # detached and stopped by the host after 25 seconds: the distroless
          # runtime intentionally has no shell or timeout utility.
          # Exit 124 means the server was still running when stopped and is a
          # PASS; exit 125 is a docker infra error (pull/daemon) — retried.
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            logfile="/tmp/boot-${platform//\//-}.log"
            echo "Boot smoke test: ${platform}"
            rc=0
            for attempt in 1 2 3 4 5; do
              container_id=""
              set +e
              container_id="$(docker run -d --platform "${platform}" "${IMAGE_REF}" \
                /usr/local/bin/rustshare-server 2>"${logfile}")"
              launch_rc=$?
              if [ "${launch_rc}" -eq 125 ]; then
                rc=125
              elif [ "${launch_rc}" -ne 0 ]; then
                rc="${launch_rc}"
              else
                sleep 25
                container_state="$(docker inspect --format '{{.State.Status}}' "${container_id}" 2>>"${logfile}")"
                if [ "${container_state}" = "running" ]; then
                  rc=124
                else
                  rc="$(docker inspect --format '{{.State.ExitCode}}' "${container_id}" 2>>"${logfile}")"
                fi
                docker logs "${container_id}" >>"${logfile}" 2>&1
              fi
              if [ -n "${container_id}" ]; then
                docker rm -f "${container_id}" >/dev/null 2>&1
              fi
              set -e
              [ "$rc" -ne 125 ] && break
              echo "docker infrastructure error (exit 125), attempt ${attempt}/5; retrying"
              sleep 10
            done
            if grep -E "GLIBC_[0-9.]+' not found|error while loading shared libraries|not found \(required by" "${logfile}"; then
              echo "::error::FAIL ${platform}: dynamic loader error (glibc mismatch or missing shared library)"
              exit 1
            fi
            case "$rc" in
              124)
                echo "PASS ${platform}: server ran until timeout killed it (exec bit + loader OK)"
                ;;
              126|127)
                echo "::error::FAIL ${platform}: exec/loader defect (exit ${rc})"
                cat "${logfile}"
                exit 1
                ;;
              1)
                echo "PASS ${platform}: binary executed and linked; app exited (no database in smoke env)"
                ;;
              *)
                echo "::error::FAIL ${platform}: unexpected exit code ${rc}"
                cat "${logfile}"
                exit 1
                ;;
            esac
          done

      - name: Scan exact release images before promotion
        shell: bash
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
          BACKEND_DIGEST: ${{ steps.build.outputs.digest || steps.qualified.outputs.backend_digest }}
          OBSERVER_DIGEST: ${{ steps.build_observer.outputs.digest || steps.qualified.outputs.observer_digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/trivy-cache
          for platform in linux/amd64 linux/arm64; do
            for image in \
              "${IMAGE_NAME}@${BACKEND_DIGEST}" \
              "${OBSERVER_IMAGE_NAME}@${OBSERVER_DIGEST}"; do
              echo "Scanning ${image} (${platform})"
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -v /tmp/trivy-cache:/root/.cache/trivy \
                "${TRIVY_IMAGE}" image \
                --platform "${platform}" \
                --scanners vuln \
                --severity CRITICAL,HIGH \
                --ignore-unfixed=false \
                --exit-code 1 \
                "${image}"
            done
          done

  generate-sbom:
    name: Generate SBOMs
    needs: [build-binaries, build-and-push-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM for x86_64 binary
        uses: anchore/sbom-action@v0.24.0
        with:
          file: ./artifacts/rustshare-server-x86_64-unknown-linux-gnu
          format: spdx-json
          output-file: sbom-x86_64.spdx.json
          upload-artifact: true
          upload-release-assets: false
          artifact-name: sbom-x86_64

      - name: Generate SBOM for aarch64 binary
        uses: anchore/sbom-action@v0.24.0
        with:
          file: ./artifacts/rustshare-server-aarch64-unknown-linux-gnu
          format: spdx-json
          output-file: sbom-aarch64.spdx.json
          upload-artifact: true
          upload-release-assets: false
          artifact-name: sbom-aarch64

      - name: Generate SBOM for Docker image
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ needs.build-and-push-image.outputs.digest }}
          format: spdx-json
          output-file: sbom-docker.spdx.json
          upload-artifact: true
          upload-release-assets: false
          artifact-name: sbom-docker

      - name: Generate SBOM for Chat observer image
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.OBSERVER_IMAGE_NAME }}@${{ needs.build-and-push-image.outputs.observer_digest }}
          format: spdx-json
          output-file: sbom-chat-observer.spdx.json
          upload-artifact: true
          upload-release-assets: false
          artifact-name: sbom-chat-observer

  attest-artifacts:
    name: Attest artifacts
    needs: [build-binaries, build-and-push-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest binaries
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: './artifacts/rustshare-server-*'

      - name: Attest Docker image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build-and-push-image.outputs.digest }}
          push-to-registry: true

      - name: Attest Chat observer image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.OBSERVER_IMAGE_NAME }}
          subject-digest: ${{ needs.build-and-push-image.outputs.observer_digest }}
          push-to-registry: true

  promote-verified-images:
    name: Publish verified image references
    needs: [validate-tag, build-and-push-image, generate-sbom, attest-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image references
        env:
          QUALIFICATION_ONLY: ${{ needs.validate-tag.outputs.qualification_only }}
          RELEASE_TAGS: ${{ needs.validate-tag.outputs.docker_tags }}
          RELEASE_COMMIT: ${{ needs.validate-tag.outputs.commit }}
          IMAGE_DIGEST: ${{ needs.build-and-push-image.outputs.digest }}
          OBSERVER_IMAGE_DIGEST: ${{ needs.build-and-push-image.outputs.observer_digest }}
        shell: bash
        run: |
          set -euo pipefail
          ensure_tag_absent() {
            local ref="$1" inspect_output
            if inspect_output="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
              echo "::error::image tag already exists: ${ref}"
              return 1
            fi
            if ! grep -Eiq '(not found|manifest unknown)' <<<"${inspect_output}"; then
              echo "::error::unable to verify image tag absence: ${ref}"
              printf '%s\n' "${inspect_output}"
              return 1
            fi
          }

          if [[ "${QUALIFICATION_ONLY}" == true ]]; then
            tag="qualified-${RELEASE_COMMIT}"
            for image in "${IMAGE_NAME}" "${OBSERVER_IMAGE_NAME}"; do
              ensure_tag_absent "${image}:${tag}"
            done
            docker buildx imagetools create --tag "${IMAGE_NAME}:${tag}" "${IMAGE_NAME}@${IMAGE_DIGEST}"
            docker buildx imagetools create --tag "${OBSERVER_IMAGE_NAME}:${tag}" "${OBSERVER_IMAGE_NAME}@${OBSERVER_IMAGE_DIGEST}"
            {
              echo '## Pre-tag qualification passed'
              echo
              echo "Source: \`${GITHUB_SHA}\`"
              echo "Backend: \`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
              echo "Observer: \`${OBSERVER_IMAGE_NAME}@${OBSERVER_IMAGE_DIGEST}\`"
              echo "Qualified tags: \`${IMAGE_NAME}:${tag}\`, \`${OBSERVER_IMAGE_NAME}:${tag}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          tags=()
          while IFS= read -r entry; do
            [[ -n "${entry}" ]] || continue
            [[ "${entry}" == type=raw,value=* ]] || {
              echo "::error::unexpected docker_tags entry: ${entry}"
              exit 1
            }
            tag="${entry#type=raw,value=}"
            ensure_tag_absent "${IMAGE_NAME}:${tag}"
            tags+=(--tag "${IMAGE_NAME}:${tag}")
          done <<< "${RELEASE_TAGS}"
          sha_tag="sha-${RELEASE_COMMIT:0:7}"
          ensure_tag_absent "${IMAGE_NAME}:${sha_tag}"
          tags+=(--tag "${IMAGE_NAME}:${sha_tag}")
          docker buildx imagetools create "${tags[@]}" "${IMAGE_NAME}@${IMAGE_DIGEST}"

          observer_tags=()
          while IFS= read -r entry; do
            [[ -n "${entry}" ]] || continue
            tag="${entry#type=raw,value=}"
            ensure_tag_absent "${OBSERVER_IMAGE_NAME}:${tag}"
            observer_tags+=(--tag "${OBSERVER_IMAGE_NAME}:${tag}")
          done <<< "${RELEASE_TAGS}"
          ensure_tag_absent "${OBSERVER_IMAGE_NAME}:${sha_tag}"
          observer_tags+=(--tag "${OBSERVER_IMAGE_NAME}:${sha_tag}")
          docker buildx imagetools create "${observer_tags[@]}" \
            "${OBSERVER_IMAGE_NAME}@${OBSERVER_IMAGE_DIGEST}"

  create-release:
    name: Create GitHub Release
    needs: [validate-tag, build-and-push-image, generate-sbom, attest-artifacts, promote-verified-images]
    if: needs.validate-tag.outputs.qualification_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: sbom-*
          merge-multiple: true

      - name: Rename SBOM files to include extension
        run: |
          mv ./artifacts/sbom-x86_64 ./artifacts/sbom-x86_64.spdx.json || true
          mv ./artifacts/sbom-aarch64 ./artifacts/sbom-aarch64.spdx.json || true
          mv ./artifacts/sbom-docker ./artifacts/sbom-docker.spdx.json || true
          mv ./artifacts/sbom-chat-observer ./artifacts/sbom-chat-observer.spdx.json || true

      - name: Record immutable container image references
        env:
          BACKEND_DIGEST: ${{ needs.build-and-push-image.outputs.digest }}
          OBSERVER_DIGEST: ${{ needs.build-and-push-image.outputs.observer_digest }}
        run: |
          cat > ./artifacts/container-images.txt <<EOF
          ${IMAGE_NAME}@${BACKEND_DIGEST}
          ${OBSERVER_IMAGE_NAME}@${OBSERVER_DIGEST}
          EOF

      - name: Check if release already exists
        id: check_release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = 'v${{ needs.validate-tag.outputs.version }}';
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              core.setOutput('exists', 'true');
              console.log(`Release for ${tag} already exists. Skipping.`);
            } catch (e) {
              if (e.status === 404) {
                core.setOutput('exists', 'false');
              } else {
                throw e;
              }
            }

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate-tag.outputs.version }}
          name: ${{ needs.validate-tag.outputs.release_name }}
          prerelease: ${{ needs.validate-tag.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            ./artifacts/rustshare-server-*
            ./artifacts/sbom-*.spdx.json
            ./artifacts/container-images.txt
