name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3 or 0.8.0-alpha.1)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kubedoio/rustshare-backend

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_major_minor: ${{ steps.resolve.outputs.version_major_minor }}
      version_major: ${{ steps.resolve.outputs.version_major }}
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      docker_tags: ${{ steps.resolve.outputs.docker_tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve version and commit
        id: resolve
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          TAG_REF: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT="${{ github.sha }}"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # The dispatch input is a bare version; the tag carries the v prefix.
            # Passed via env so actor-controlled input never reaches shell syntax.
            TAG="v${DISPATCH_VERSION}"
          else
            # push: tags:
            TAG="$TAG_REF"
          fi

          # Single source of truth for tag grammar and release metadata.
          source scripts/release-tag.sh
          if ! resolve_release_tag "$TAG" > /tmp/release-tag.out; then
            echo "::error::Invalid release tag: $TAG. Expected strict semver with a v prefix (e.g., v0.7.0 or v0.8.0-alpha.1)."
            exit 1
          fi

          # The commit the release tag points at; used by the dispatch guard
          # below and by the release-immutability decision.
          TAG_SHA="$(git rev-parse "${TAG}^{}" 2>/dev/null || true)"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # A dispatch must reference an EXISTING tag that points at the
            # exact commit being released. Without this, dispatching a stable
            # version (e.g. 0.7.0) would push unrelated code to the stable
            # Docker channels and clobber them.
            if [[ -z "$TAG_SHA" || "$TAG_SHA" != "$COMMIT" ]]; then
              echo "::error::workflow_dispatch version '${DISPATCH_VERSION}' must exist as tag ${TAG} pointing at commit ${COMMIT} (found ${TAG_SHA:-none})."
              exit 1
            fi
          fi

          # Release immutability (before any build): a version that already has
          # a GitHub release may only be re-run via workflow_dispatch at ITS
          # OWN commit (explicit repair mode). A tag push against an existing
          # release is a force-move/duplicate attempt and is rejected. This
          # composes with the dispatch guard above — the guard pins a dispatch
          # to the tag's commit, this decision pins the run to an unreleased
          # version or a same-commit repair.
          # gh exits 0 when the release exists; on HTTP errors it exits 1, so
          # the status line distinguishes "not found" from real failures (any
          # non-200/404 status fails the job closed). Only stdout is parsed —
          # gh prints the response headers there with -i — while stderr keeps
          # gh's own error text in the step log; a missing status line (e.g.
          # gh failed before any HTTP response) also fails the job closed.
          # '+' in build-metadata tags must be %-encoded in the API path.
          ENCODED_TAG="${TAG//+/%2B}"
          set +e
          api_out="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${ENCODED_TAG}" --silent -i)"
          api_rc=$?
          set -e
          status_line="$(printf '%s\n' "$api_out" | head -n1)"
          if [[ -z "$status_line" ]]; then
            echo "::error::release immutability check failed: gh api exited ${api_rc} without an HTTP status line; refusing to proceed"
            exit 1
          fi
          status="${status_line#* }" # "404 Not Found"
          status="${status%% *}"     # "404"
          RELEASE_EXISTS=false
          if [[ "$status" == "200" ]]; then
            RELEASE_EXISTS=true
          elif [[ "$status" == "404" ]]; then
            :
          else
            echo "::error::release immutability check failed (HTTP ${status}); refusing to proceed"
            exit 1
          fi
          # Repair mode: a dispatch may rebuild an EXISTING version only when
          # the tree at this commit differs from the version tag's commit
          # EXCLUSIVELY in release-pipeline files (workflow, tag script,
          # Dockerfile, validation workflow, release-process doc). Any
          # application-code difference means this is a republish attempt at a
          # different commit and is refused.
          REPAIR_DIFF="$(git diff --name-only "${TAG}^{}" HEAD 2>/dev/null | grep -vE '^(\.github/workflows/release\.yml|scripts/release-tag\.sh|docker/backend\.Dockerfile|\.github/workflows/release-tag-validation\.yml|docs/release-process\.md)$' || true)"
          if [[ -z "$REPAIR_DIFF" ]]; then
            REPAIR_DIFF_EMPTY="true"
          else
            REPAIR_DIFF_EMPTY="false"
          fi
          DECISION="$(immutability_decision "$EVENT_NAME" "$TAG" "$COMMIT" "$RELEASE_EXISTS" "$TAG_SHA" "$REPAIR_DIFF_EMPTY" || true)"
          echo "Immutability decision: ${DECISION}"
          if [[ "$DECISION" == FAIL:* ]]; then
            echo "::error::${DECISION#FAIL:}"
            exit 1
          fi

          # resolve_release_tag emits GITHUB_OUTPUT-compatible key=value lines
          # (multiline docker_tags via the <<RS_EOF delimiter); append verbatim.
          cat /tmp/release-tag.out >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Resolved: $(grep -E '^(version|is_prerelease|release_name)=' /tmp/release-tag.out | tr '\n' ' ')"

  build-binaries:
    name: Build release binaries
    needs: validate-tag
    if: needs.validate-tag.outputs.should_release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    # Build inside the same base image the Dockerfile builder stage uses
    # (rust:1.97-bookworm, glibc 2.36). Building on the ubuntu-latest host
    # (glibc 2.39) produced binaries that cannot load in the
    # debian:bookworm-slim runtime image (GLIBC_2.38/2.39 not found).
    container:
      image: rust:1.97-bookworm
    # The container's default shell is /bin/sh (dash), which lacks the `[[`
    # builtin used by the stage step — the arm64 leg silently fell into the
    # x86_64 strip branch and failed. Force bash for every step of this job.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # The container build links against glibc 2.36; keep its cache key
          # separate from the host (glibc 2.39) CI runs so each restores its
          # own artifacts.
          prefix-key: release-container

      - name: Install cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          apt-get update
          apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin rustshare-server
        env:
          CARGO_NET_RETRY: 10

      - name: Stage binary artifact
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            aarch64-linux-gnu-strip "target/${{ matrix.target }}/release/rustshare-server"
          else
            strip "target/${{ matrix.target }}/release/rustshare-server"
          fi
          cp "target/${{ matrix.target }}/release/rustshare-server" "rustshare-server-${{ matrix.target }}"
          chmod +x "rustshare-server-${{ matrix.target }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: rustshare-server-${{ matrix.target }}
          if-no-files-found: error

  build-and-push-image:
    name: Build and push Docker image
    needs: [validate-tag, build-binaries]
    if: needs.validate-tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./
          pattern: binary-*
          merge-multiple: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # Kept for LABELS only: the build is tagged with the unadvertised
          # candidate tag, and the released tags (docker_tags + sha) are
          # created by the promote step AFTER the boot gate passes. The
          # metadata action derives the OCI version label from the first tag,
          # so it is pinned to the real release version below; revision,
          # created, source, etc. are emitted as before.
          tags: |
            type=raw,value=candidate-${{ github.run_id }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate-tag.outputs.version }}

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Only the candidate tag is pushed here; release tags are promoted
          # from this digest after the boot gate.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            USE_PRECOMPILED=true
            VERSION=${{ needs.validate-tag.outputs.version }}
            REVISION=${{ needs.validate-tag.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot smoke test (exec bit + dynamic linker)
        shell: bash
        run: |
          # Run from the candidate tag, not the digest: pulling the same
          # multi-arch digest twice with different --platform values fails in
          # the runner's classic docker store ("cannot overwrite digest ...").
          # The candidate tag is re-resolved per leg, and both legs reference
          # the exact image this job just built and pushed. The released tags
          # (docker_tags + sha) are only ever touched by the promote step
          # below, after this gate passes: on a fresh release they do not
          # exist yet and are created; on a repair run they already exist and
          # are re-pointed to the verified digest (intended).
          IMAGE_REF="${IMAGE_NAME}:candidate-${GITHUB_RUN_ID}"
          # The server has no --help/--version: main() ignores argv and boots
          # straight into startup, which first validates config and connects to
          # Postgres. Without a database it exits 1 quickly — that is a PASS,
          # because it proves the kernel executed the file and the dynamic
          # linker resolved it. The two boot defects this gate guards against
          # both die before any app code runs:
          #   missing exec bit / exec format -> exit 126
          #   glibc version mismatch -> ld.so error on stderr, exit 1 or 127
          # Exit codes alone cannot separate a loader failure from the app's
          # own no-database exit (both can be 1), so the log is also scanned
          # for ld.so's distinctive error messages. Exit 124 (timeout killed
          # a server that was still running) is a PASS; exit 125 is a docker
          # infra error (pull/daemon) — retried.
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            logfile="/tmp/boot-${platform//\//-}.log"
            echo "Boot smoke test: ${platform}"
            rc=0
            for attempt in 1 2 3 4 5; do
              set +e
              docker run --rm --platform "${platform}" "${IMAGE_REF}" \
                timeout 25 /usr/local/bin/rustshare-server \
                > "${logfile}" 2>&1
              rc=$?
              set -e
              [ "$rc" -ne 125 ] && break
              echo "docker infrastructure error (exit 125), attempt ${attempt}/5; retrying"
              sleep 10
            done
            if grep -E "GLIBC_[0-9.]+' not found|error while loading shared libraries|not found \(required by" "${logfile}"; then
              echo "::error::FAIL ${platform}: dynamic loader error (glibc mismatch or missing shared library)"
              exit 1
            fi
            case "$rc" in
              124)
                echo "PASS ${platform}: server ran until timeout killed it (exec bit + loader OK)"
                ;;
              126|127)
                echo "::error::FAIL ${platform}: exec/loader defect (exit ${rc})"
                cat "${logfile}"
                exit 1
                ;;
              1)
                echo "PASS ${platform}: binary executed and linked; app exited (no database in smoke env)"
                ;;
              *)
                echo "::error::FAIL ${platform}: unexpected exit code ${rc}"
                cat "${logfile}"
                exit 1
                ;;
            esac
          done

      - name: Promote release tags (post-gate)
        shell: bash
        env:
          RELEASE_TAGS: ${{ needs.validate-tag.outputs.docker_tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Reached only when the boot smoke test passed: a failed gate fails
          # the job, so this step (and every downstream job) never runs. The
          # released tags — version (+ major/minor/latest for stable) and
          # sha-<short> — are created as references to the SAME digest the
          # gate just verified; nothing is rebuilt. On a repair run the
          # version tags already exist and are re-pointed to the verified
          # digest (the intended repair behavior). latest/major/minor can
          # therefore only move after a green gate.
          set -euo pipefail
          TAGS=()
          while IFS= read -r entry; do
            [[ -n "$entry" ]] || continue
            [[ "$entry" == type=raw,value=* ]] || {
              echo "::error::unexpected docker_tags entry: $entry"
              exit 1
            }
            tag="${entry#type=raw,value=}"
            TAGS+=(--tag "${IMAGE_NAME}:${tag}")
            echo "Promoting ${IMAGE_NAME}:${tag}"
          done <<< "$RELEASE_TAGS"
          TAGS+=(--tag "${IMAGE_NAME}:sha-${GITHUB_SHA:0:7}")
          echo "Promoting ${IMAGE_NAME}:sha-${GITHUB_SHA:0:7}"
          docker buildx imagetools create "${TAGS[@]}" "${IMAGE_NAME}@${IMAGE_DIGEST}"

  generate-sbom:
    name: Generate SBOMs
    needs: [build-binaries, build-and-push-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM for x86_64 binary
        uses: anchore/sbom-action@v0.24.0
        with:
          file: ./artifacts/rustshare-server-x86_64-unknown-linux-gnu
          format: spdx-json
          output-file: sbom-x86_64.spdx.json
          upload-artifact: true
          upload-release-assets: false
          artifact-name: sbom-x86_64

      - name: Generate SBOM for aarch64 binary
        uses: anchore/sbom-action@v0.24.0
        with:
          file: ./artifacts/rustshare-server-aarch64-unknown-linux-gnu
          format: spdx-json
          output-file: sbom-aarch64.spdx.json
          upload-artifact: true
          upload-release-assets: false
          artifact-name: sbom-aarch64

      - name: Generate SBOM for Docker image
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ needs.build-and-push-image.outputs.digest }}
          format: spdx-json
          output-file: sbom-docker.spdx.json
          upload-artifact: true
          upload-release-assets: false
          artifact-name: sbom-docker

  attest-artifacts:
    name: Attest artifacts
    needs: [build-binaries, build-and-push-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest binaries
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: './artifacts/rustshare-server-*'

      - name: Attest Docker image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build-and-push-image.outputs.digest }}
          push-to-registry: true

  create-release:
    name: Create GitHub Release
    needs: [validate-tag, generate-sbom, attest-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: sbom-*
          merge-multiple: true

      - name: Rename SBOM files to include extension
        run: |
          mv ./artifacts/sbom-x86_64 ./artifacts/sbom-x86_64.spdx.json || true
          mv ./artifacts/sbom-aarch64 ./artifacts/sbom-aarch64.spdx.json || true
          mv ./artifacts/sbom-docker ./artifacts/sbom-docker.spdx.json || true

      - name: Check if release already exists
        id: check_release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = 'v${{ needs.validate-tag.outputs.version }}';
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              core.setOutput('exists', 'true');
              console.log(`Release for ${tag} already exists. Skipping.`);
            } catch (e) {
              if (e.status === 404) {
                core.setOutput('exists', 'false');
              } else {
                throw e;
              }
            }

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate-tag.outputs.version }}
          name: ${{ needs.validate-tag.outputs.release_name }}
          prerelease: ${{ needs.validate-tag.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            ./artifacts/rustshare-server-*
            ./artifacts/sbom-*.spdx.json
