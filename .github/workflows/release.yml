name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3 or 0.8.0-alpha.1)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kubedoio/rustshare-backend

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_major_minor: ${{ steps.resolve.outputs.version_major_minor }}
      version_major: ${{ steps.resolve.outputs.version_major }}
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      docker_tags: ${{ steps.resolve.outputs.docker_tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve version and commit
        id: resolve
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          TAG_REF: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          COMMIT="${{ github.sha }}"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # The dispatch input is a bare version; the tag carries the v prefix.
            # Passed via env so actor-controlled input never reaches shell syntax.
            TAG="v${DISPATCH_VERSION}"
          else
            # push: tags:
            TAG="$TAG_REF"
          fi

          # Single source of truth for tag grammar and release metadata.
          source scripts/release-tag.sh
          if ! resolve_release_tag "$TAG" > /tmp/release-tag.out; then
            echo "::error::Invalid release tag: $TAG. Expected strict semver with a v prefix (e.g., v0.7.0 or v0.8.0-alpha.1)."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # A dispatch must reference an EXISTING tag that points at the
            # exact commit being released. Without this, dispatching a stable
            # version (e.g. 0.7.0) would push unrelated code to the stable
            # Docker channels and clobber them.
            TAG_SHA="$(git rev-parse "${TAG}^{}" 2>/dev/null || true)"
            if [[ -z "$TAG_SHA" || "$TAG_SHA" != "$COMMIT" ]]; then
              echo "::error::workflow_dispatch version '${DISPATCH_VERSION}' must exist as tag ${TAG} pointing at commit ${COMMIT} (found ${TAG_SHA:-none})."
              exit 1
            fi
          fi

          # resolve_release_tag emits GITHUB_OUTPUT-compatible key=value lines
          # (multiline docker_tags via the <<RS_EOF delimiter); append verbatim.
          cat /tmp/release-tag.out >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Resolved: $(grep -E '^(version|is_prerelease|release_name)=' /tmp/release-tag.out | tr '\n' ' ')"

  build-binaries:
    name: Build release binaries
    needs: validate-tag
    if: needs.validate-tag.outputs.should_release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin rustshare-server
        env:
          CARGO_NET_RETRY: 10

      - name: Stage binary artifact
        run: |
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            aarch64-linux-gnu-strip "target/${{ matrix.target }}/release/rustshare-server"
          else
            strip "target/${{ matrix.target }}/release/rustshare-server"
          fi
          cp "target/${{ matrix.target }}/release/rustshare-server" "rustshare-server-${{ matrix.target }}"
          chmod +x "rustshare-server-${{ matrix.target }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: rustshare-server-${{ matrix.target }}
          if-no-files-found: error

  build-and-push-image:
    name: Build and push Docker image
    needs: [validate-tag, build-binaries]
    if: needs.validate-tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./
          pattern: binary-*
          merge-multiple: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            ${{ needs.validate-tag.outputs.docker_tags }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            USE_PRECOMPILED=true
            VERSION=${{ needs.validate-tag.outputs.version }}
            REVISION=${{ needs.validate-tag.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  generate-sbom:
    name: Generate SBOMs
    needs: [build-binaries, build-and-push-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM for x86_64 binary
        uses: anchore/sbom-action@v0.24.0
        with:
          file: ./artifacts/rustshare-server-x86_64-unknown-linux-gnu
          format: spdx-json
          output-file: sbom-x86_64.spdx.json
          upload-artifact: true
          upload-release-assets: false
          artifact-name: sbom-x86_64

      - name: Generate SBOM for aarch64 binary
        uses: anchore/sbom-action@v0.24.0
        with:
          file: ./artifacts/rustshare-server-aarch64-unknown-linux-gnu
          format: spdx-json
          output-file: sbom-aarch64.spdx.json
          upload-artifact: true
          upload-release-assets: false
          artifact-name: sbom-aarch64

      - name: Generate SBOM for Docker image
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ needs.build-and-push-image.outputs.digest }}
          format: spdx-json
          output-file: sbom-docker.spdx.json
          upload-artifact: true
          upload-release-assets: false
          artifact-name: sbom-docker

  attest-artifacts:
    name: Attest artifacts
    needs: [build-binaries, build-and-push-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest binaries
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: './artifacts/rustshare-server-*'

      - name: Attest Docker image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build-and-push-image.outputs.digest }}
          push-to-registry: true

  create-release:
    name: Create GitHub Release
    needs: [validate-tag, generate-sbom, attest-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: sbom-*
          merge-multiple: true

      - name: Rename SBOM files to include extension
        run: |
          mv ./artifacts/sbom-x86_64 ./artifacts/sbom-x86_64.spdx.json || true
          mv ./artifacts/sbom-aarch64 ./artifacts/sbom-aarch64.spdx.json || true
          mv ./artifacts/sbom-docker ./artifacts/sbom-docker.spdx.json || true

      - name: Check if release already exists
        id: check_release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = 'v${{ needs.validate-tag.outputs.version }}';
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              core.setOutput('exists', 'true');
              console.log(`Release for ${tag} already exists. Skipping.`);
            } catch (e) {
              if (e.status === 404) {
                core.setOutput('exists', 'false');
              } else {
                throw e;
              }
            }

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate-tag.outputs.version }}
          name: ${{ needs.validate-tag.outputs.release_name }}
          prerelease: ${{ needs.validate-tag.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            ./artifacts/rustshare-server-*
            ./artifacts/sbom-*.spdx.json
