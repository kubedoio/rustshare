version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      # Backend reads AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (see
      # backend/crates/storage/src/object_store.rs); base compose has no
      # SERVER_PORT, so keep it explicit.
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    ports:
      - "8080:8080"
