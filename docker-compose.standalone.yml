# RustShare Standalone Deployment
# 
# This is the zero-PostgreSQL standalone deployment configuration.
# It runs a single RustShare instance with local filesystem metadata storage.
#
# Use this for:
# - Development environments
# - Single-node deployments
# - Simple installations
#
# For production with high availability, use docker-compose.distributed.yml

services:
  rustfs:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rustfsadmin
      MINIO_ROOT_PASSWORD: changeme
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 9000 && nc -z localhost 9001"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_WS_URL: /api/ws
    ports:
      - "8080:8080"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      # Runtime Profile - standalone mode (no Redis required)
      RUSTSHARE_RUNTIME_PROFILE: standalone
      
      # RustFS Configuration
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_PUBLIC_ENDPOINT: http://localhost:9000
      RUSTFS_REGION: us-east-1
      RUSTFS_BUCKET: rustshare-files
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: changeme
      
      # Local Storage for Metadata (standalone mode)
      RUSTSHARE_LOCAL_STORAGE_PATH: /data/metadata
      
      # Metadata Configuration
      RUSTSHARE_METADATA_PREFIX: apps/rustshare
      RUSTSHARE_METADATA_NAMESPACE: default
      
      # Security
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      RUSTSHARE_SECRET_ENCRYPTION_KEY: ${RUSTSHARE_SECRET_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      
      # Admin User
      RUSTSHARE_ADMIN_USERNAME: admin
      RUSTSHARE_ADMIN_EMAIL: admin@localhost
      RUSTSHARE_ADMIN_PASSWORD: admin123
      
      # Logging
      RUST_LOG: ${RUST_LOG:-info,rustshare=debug}
      
      # Rate Limiting
      RUSTSHARE_RATE_LIMIT_AUTH_LOGIN_PER_MINUTE: ${RUSTSHARE_RATE_LIMIT_AUTH_LOGIN_PER_MINUTE:-10}
      RUSTSHARE_RATE_LIMIT_OIDC_LOGIN_PER_MINUTE: ${RUSTSHARE_RATE_LIMIT_OIDC_LOGIN_PER_MINUTE:-30}
      
      # Frontend
      FRONTEND_DIST_DIR: /app/frontend-build
    volumes:
      - metadata_data:/data/metadata
    depends_on:
      rustfs:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  rustfs_data:
  metadata_data:
