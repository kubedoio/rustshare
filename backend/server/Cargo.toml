[package]
name = "rustshare-server"
version.workspace = true
edition.workspace = true
autotests = false

[[bin]]
name = "rustshare-server"
path = "src/main.rs"

[dependencies]
rustshare-core = { path = "../crates/core" }
rustshare-storage = { path = "../crates/storage" }
rustshare-auth = { path = "../crates/auth" }
rustshare-infrastructure = { path = "../crates/infrastructure" }
rustshare-crypto = { path = "../crates/crypto" }

tokio.workspace = true
axum = { workspace = true, features = ["multipart", "ws"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower.workspace = true
tower-http = { workspace = true, features = ["fs"] }
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["macro-diagnostics"] }
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytes.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
futures-util = "0.3"
dotenv = "0.15"
governor = "0.6"
nonzero_ext = "0.3"
openidconnect = "4.0.1"
url = "2.5"

[dev-dependencies]
tokio-tungstenite = "0.24"
reqwest = { version = "0.11", features = ["multipart"] }
