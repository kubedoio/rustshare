[package]
name = "rustshare-server"
version.workspace = true
edition.workspace = true
autotests = false

[[bin]]
name = "rustshare-server"
path = "src/main.rs"

[dependencies]
rustshare-core = { path = "../crates/core" }
rustshare-storage = { path = "../crates/storage" }
rustshare-auth = { path = "../crates/auth" }
rustshare-infrastructure = { path = "../crates/infrastructure" }
rustshare-crypto = { path = "../crates/crypto" }

tokio.workspace = true
axum = { workspace = true, features = ["multipart", "ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower.workspace = true
tower-http = { workspace = true, features = ["fs"] }
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["macro-diagnostics"] }
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytes.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
futures-util = "0.3"
dotenv = "0.15"
hmac = { workspace = true }
hex = { workspace = true }
sha2.workspace = true
reqwest = { workspace = true }
async-trait = "0.1"
governor = "0.6"
constant_time_eq = "0.3"
nonzero_ext = "0.3"
openidconnect = "4.0.1"
url = "2.5"
urlencoding = "2.1"
base64 = { workspace = true }
rand = { workspace = true }
image = { version = "0.24", default-features = false, features = ["webp", "png", "jpeg", "gif"] }
mime_guess = "2.0"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "pool"] }

[[test]]
name = "admin_require_admin_test"
path = "../tests/admin_require_admin_test.rs"

[[test]]
name = "admin_users_test"
path = "../tests/admin_users_test.rs"

[[test]]
name = "admin_groups_test"
path = "../tests/admin_groups_test.rs"

[[test]]
name = "admin_config_oidc_test"
path = "../tests/admin_config_oidc_test.rs"

[[test]]
name = "admin_config_smtp_test"
path = "../tests/admin_config_smtp_test.rs"

[[test]]
name = "admin_webhooks_test"
path = "../tests/admin_webhooks_test.rs"

[[test]]
name = "admin_audit_test"
path = "../tests/admin_audit_test.rs"

[dev-dependencies]
tokio-tungstenite = "0.24"
rustshare-crypto = { path = "../crates/crypto" }
hmac = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
