[package]
name = "rustshare-server"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[features]
test-recording-provider = []

[[bin]]
name = "rustshare-server"
path = "src/main.rs"

[dependencies]
rustshare-core = { path = "../crates/core" }
rustshare-storage = { path = "../crates/storage" }
rustshare-auth = { path = "../crates/auth" }
rustshare-infrastructure = { path = "../crates/infrastructure" }
rustshare-crypto = { path = "../crates/crypto" }
rustshare-resource-auth = { path = "../crates/resource-auth" }
nostr = { workspace = true }
rustshare-integration-events = { path = "../crates/integration-events" }
rustshare-memory = { path = "../crates/memory" }

tokio.workspace = true
axum = { workspace = true, features = ["multipart", "ws"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
tower.workspace = true
tower-http = { workspace = true, features = ["fs"] }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["macro-diagnostics", "v5"] }
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytes.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
futures-util = "0.3"
tokio-tungstenite = "0.30"
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"
dotenvy = "0.15"
envy = "0.4"
hmac = { workspace = true }
hex = { workspace = true }
sha2.workspace = true
md5 = "0.8"
reqwest = { workspace = true }
governor = "0.10"
constant_time_eq = "0.5"
openidconnect = "4.0.1"
url = "2.5"
percent-encoding = "2.3"
base64 = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif"] }
mime_guess = "2.0"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "pool"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1"
mailparse = "0.16"
tokio-rustls = "0.26"
webpki-roots = "1.0"
slug = "0.1.6"
regex = "1.12"
serde_yaml = "0.9"
validator = { workspace = true }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
ammonia = "4"

