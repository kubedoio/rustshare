[workspace]
members = [
    "crates/core",
    "crates/storage",
    "crates/auth",
    "crates/crypto",
    "crates/infrastructure",
    "server",
]
resolver = "2"

# Note: crates/protocols will be added in Phase 4

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.95.0"
authors = ["RustShare Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate", "ipnetwork"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto
argon2 = "0.5"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
rand = "0.10"

# S3 client
aws-sdk-s3 = "1.17"
aws-config = "1.1"
# Pinned to avoid a breaking change in aws-smithy-types 1.5.0 that breaks
# aws-runtime 1.7.4 compilation. Remove once AWS SDK releases a compatible set.
aws-smithy-types = "=1.5.0"
time = "=0.3.49"

# Utilities
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bytes = "1.5"
sha2 = "0.11"
aes-gcm = "0.10"
base64 = { version = "0.22", features = ["alloc"] }
hmac = "0.13"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

# OpenAPI generation
utoipa = { version = "5.0", features = ["uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }

# Testing
mockall = "0.14"
validator = { version = "0.20", features = ["derive"] }
