[package]
name = "rustshare-resource-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Elembra cross-Application identity/resource contracts: PrincipalContext, ResourceRef and source authorization"

[dependencies]
rustshare-core = { path = "../core" }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
bytes = { workspace = true }
futures-util = { workspace = true }
percent-encoding = "2.3"
tracing = { workspace = true }
nostr = { workspace = true }
ipnet = "2"
url = "2.5"
utoipa = { workspace = true }
ed25519-dalek = { version = "2.2", optional = true }
sha2 = { workspace = true, optional = true }

[features]
default = []
upstream-relay-provisioning = ["dep:ed25519-dalek", "dep:sha2"]

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
