[package]
name = "rustshare-storage"
version.workspace = true
edition.workspace = true

[dependencies]
rustshare-core = { path = "../core" }
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
dashmap = "6"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
aws-sdk-s3.workspace = true
aws-config.workspace = true
bytes = "1.5"
md5 = "0.8"
async-trait = "0.1"
futures = "0.3"

# Redis support for distributed coordination (optional)
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"], optional = true }

# JWT for session management
jsonwebtoken = "10"

# Crypto for session hashing
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[features]
default = []
redis-coordination = ["redis"]
