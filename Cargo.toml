[workspace]
members = [
    "backend/crates/core",
    "backend/crates/storage",
    "backend/crates/auth",
    "backend/crates/crypto",
    "backend/crates/infrastructure",
    "backend/server",
    "apps/desktop",
    "crates/*",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
authors = ["RustShare Contributors"]
license = "Apache-2.0"
description = "A modern file-sharing and sync platform for technical teams"
repository = "https://github.com/kubedoio/rustshare"
homepage = "https://github.com/kubedoio/rustshare"
documentation = "https://github.com/kubedoio/rustshare/docs"
readme = "README.md"
keywords = ["file-sharing", "sync", "self-hosted", "rust", "storage"]
categories = ["filesystem", "web-programming"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# Crypto
argon2 = "0.5"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rand = "0.8"
sha2 = "0.11"
aes-gcm = "0.10"
base64 = { version = "0.22", features = ["alloc"] }
hmac = "0.13"
hex = "0.4"

# S3 client
aws-sdk-s3 = "1.17"
aws-config = "1.1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls"], default-features = false }

# Utilities
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.5"
glob = "0.3"
url = "2.5"

# Async
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"

# File system
notify = { version = "8.2", features = ["macos_fsevent"] }
walkdir = "2.5"
directories = "6.0"
pathdiff = "0.2"

# Configuration
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "6.0"

# Security
keyring = "3.6"

# Process management
daemonize = "0.5"
nix = { version = "0.31", features = ["process", "signal"] }

# Time serialization
humantime-serde = "1.1"

# Testing
mockall = "0.14"
tempfile = "3.10"
windows = { version = "0.61", features = ["Win32_Storage_CloudFilters", "Win32_Foundation", "Win32_System_IO", "Win32_System_SystemServices", "Win32_Security"] }

[profile.release]
opt-level = 3
lto = true
