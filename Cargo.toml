[workspace]
members = [
    "backend/crates/core",
    "backend/crates/storage",
    "backend/crates/auth",
    "backend/crates/crypto",
    "backend/crates/infrastructure",
    "backend/server",
    "desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93.1"
authors = ["RustShare Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.50", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Crypto
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = { version = "0.22", features = ["alloc"] }
hmac = "0.12"
hex = "0.4"

# S3 client
aws-sdk-s3 = "1.17"
aws-config = "1.1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls"], default-features = false }

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.5"

# Async
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"

# File system
notify = { version = "6.1", features = ["macos_fsevent"] }
walkdir = "2.5"
directories = "5.0"
pathdiff = "0.2"

# Configuration
clap = { version = "4.5", features = ["derive"] }

# Security
keyring = "3.6"

# Testing
mockall = "0.12"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
