services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rustshare
      POSTGRES_USER: rustshare
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustshare"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: rustfsadmin
      MINIO_ROOT_PASSWORD: rustfsadmin
      MINIO_DOMAIN: localhost
      MINIO_SERVER_URL: http://localhost:9000
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_WS_URL: /api/v1
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://rustshare:changeme@postgres:5432/rustshare
      RUST_LOG: debug
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_PUBLIC_ENDPOINT: http://localhost:9000
      RUSTFS_REGION: us-east-1
      RUSTFS_BUCKET: rustshare-files
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      RUSTSHARE_ADMIN_USERNAME: admin
      RUSTSHARE_ADMIN_EMAIL: admin@localhost
      RUSTSHARE_ADMIN_PASSWORD: admin123
      PASSWORD_LOGIN_ENABLED: ${PASSWORD_LOGIN_ENABLED:-true}
      RUSTSHARE_DEFAULT_STORAGE_QUOTA_BYTES: ${RUSTSHARE_DEFAULT_STORAGE_QUOTA_BYTES:-10737418240}
      FRONTEND_DIST_DIR: /app/frontend-build
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  rustfs_data:
